# BaseDownloader credential store
# ---------------------------------------------------------------------------
# Format: username=password:token
#   username  — login name shown on status pages (optional feature)
#   password  — plain-text password (PoC only; use hashed values in production)
#   token     — API token accepted in the Authorization: Bearer header
#
# Lines starting with # are ignored.
# Blank lines are ignored.
# Changes to this file are picked up within ~1 minute without a server restart.
# ---------------------------------------------------------------------------

admin=s3cr3t:mytoken123
